<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Happy Birthday Shivani 💖</title>
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#ffd6e8;--bg2:#ff9ec6;--ink:#6b1a40;--card:#fff6fa;--pk:#ff4d8d;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#3a0f2b;--bg2:#7a1f55;--ink:#ffe3ef;--card:#4d1737}}
:root[data-theme=dark]{--bg:#3a0f2b;--bg2:#7a1f55;--ink:#ffe3ef;--card:#4d1737}
html,body{height:100%;margin:0;overflow:hidden;background:#0b0409;color:var(--ink);font-family:system-ui,sans-serif;user-select:none}
section{position:fixed;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;text-align:center}
section.on{display:flex}
#s0{background:radial-gradient(#3a0f2b,#0b0409);color:#ffe3ef}
#room{background:#1a0b14;color:#ffe3ef;touch-action:none}
#party{background:linear-gradient(160deg,var(--bg),var(--bg2))}
h1,h2{font-family:'Dancing Script',cursive,serif;margin:.2em 0}
.btn{font:700 18px system-ui;border:0;border-radius:999px;padding:14px 28px;background:#ff4d8d;color:#fff;box-shadow:0 0 24px #ff4d8d88;cursor:pointer;animation:pl 1.6s infinite}
@keyframes pl{50%{transform:scale(1.07)}}
.msg{position:fixed;left:0;right:0;padding:0 16px;font-size:18px;z-index:5;pointer-events:none;text-shadow:0 0 10px #ff4d8d}
#msg{top:calc(env(safe-area-inset-top,0px) + 18px);color:#ffd0e3}
#pmsg{bottom:calc(env(safe-area-inset-bottom,0px) + 24px);font-weight:700}
.it{position:absolute;transform:translate(-50%,-50%);cursor:pointer}
#mb{width:56px;height:32px;background:#c0392b;border:2px solid #7b241c;border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:18px}
#cd{width:16px;height:64px;background:repeating-linear-gradient(45deg,#fff,#fff 6px,#ff8fb8 6px,#ff8fb8 12px);border-radius:3px}
.fl{display:none;position:absolute;left:1px;top:-28px;width:14px;height:26px;background:radial-gradient(#fff6b0,#ffb300 60%,#ff6a00);border-radius:50% 50% 50% 50%/60% 60% 40% 40%;box-shadow:0 0 30px 14px #ffa50077;animation:fk .15s infinite alternate}
.lit .fl{display:block}.wob .fl{animation:fk .06s infinite alternate;transform:scaleY(.6)}
@keyframes fk{to{transform:scale(1.1,.9) skewX(5deg)}}
#dk{position:fixed;inset:0;pointer-events:none;transition:opacity 1.2s;background:radial-gradient(circle var(--r,110px) at var(--x,50%) var(--y,50%),transparent 30%,rgba(0,0,0,.985) 100%)}
#blow{position:fixed;bottom:calc(env(safe-area-inset-bottom,0px) + 40px);display:none;z-index:6}
#fw{position:fixed;inset:0;pointer-events:none}
#hb{font-size:clamp(36px,10vw,72px);color:var(--ink);animation:fi 1.5s both;position:relative;z-index:2}
@keyframes fi{from{opacity:0;transform:translateY(20px) scale(.9)}}
.hr{position:fixed;bottom:-40px;pointer-events:none;animation:up 6s linear forwards}
@keyframes up{to{transform:translateY(-115vh) rotate(25deg);opacity:0}}
#bl{display:none;position:fixed;left:50%;bottom:-120px;font-size:96px;cursor:pointer;transform:translateX(-50%);animation:ri 4s ease-out forwards,sw 3s 4s infinite ease-in-out;z-index:3}
@keyframes ri{to{bottom:38%}}
@keyframes sw{0%,100%{transform:translateX(-50%) rotate(-6deg)}50%{transform:translateX(-50%) rotate(6deg)}}
#ch{display:none;position:fixed;left:50%;top:-20%;transform:translate(-50%,-50%);font-size:60px;line-height:1;cursor:pointer;z-index:4;transition:top 3s ease-out}
#ch span{display:block;animation:sw 2s infinite}
#nt{display:none;position:fixed;inset:0;background:#0007;z-index:20;align-items:center;justify-content:center}
#card{width:min(90vw,420px);box-sizing:border-box;background:var(--card);color:var(--ink);border:3px solid #ff4d8d;border-radius:26px;padding:26px 22px;text-align:center;box-shadow:0 0 50px #ff4d8d99;animation:op .7s both}
@keyframes op{from{transform:scale(.2) rotate(-12deg);opacity:0}}
#card>*{animation:fi .6s both}
#card .em{font-size:54px}#card h2{font-size:34px}#card p{font-size:18px;line-height:1.55;margin:.6em 0 1.2em}
#card.fin .em{animation:hb 1s infinite}@keyframes hb{50%{transform:scale(1.25)}}
.dots{margin-top:14px}.dots i{display:inline-block;width:8px;height:8px;border-radius:50%;background:#ff4d8d55;margin:0 3px}.dots i.a{background:#ff4d8d}
#hint{position:fixed;left:0;right:0;top:calc(env(safe-area-inset-top,0px) + 56px);font-size:26px;z-index:5;pointer-events:none;text-align:center}
.sp{position:fixed;pointer-events:none;z-index:9;font-size:16px;animation:sp .9s forwards}
@keyframes sp{to{transform:translateY(-40px) scale(.3);opacity:0}}
#mic{position:fixed;bottom:calc(env(safe-area-inset-bottom,0px) + 100px);display:none;z-index:6;background:none;border:2px solid #ff8fb8;color:#ffd0e3;border-radius:999px;padding:8px 16px;font:600 14px system-ui;cursor:pointer}
#card p{white-space:pre-line;min-height:4.5em}
#hrt{font-size:80px;background:none;border:0;cursor:pointer;transition:transform .15s;filter:drop-shadow(0 0 12px #ff4d8d)}
#hrt:active{transform:scale(.8)}
#fw{z-index:25}
</style></head><body>
<section id="s0" class="on"><div style="font-size:64px">🎁</div><h1 style="font-size:42px">A little surprise for Shivani 💖</h1><p>Turn your sound on 🔊</p><button class="btn" id="go">Enter the room 🌙</button></section>
<section id="room"><div id="msg" class="msg"></div><div id="hint"></div>
<div class="it" id="mb">🔥</div><div class="it" id="cd"><div class="fl"></div></div>
<div id="dk"></div><button class="btn" id="blow">💨 Blow</button><button id="mic">🎤 Or blow into your mic!</button></section>
<section id="party"><canvas id="fw"></canvas><h1 id="hb">Happy Birthday Shivani 🎂💖</h1><div id="bl">🎈</div><div id="ch"><span>🪂</span><span style="font-size:48px">💌</span></div><div id="pmsg" class="msg"></div>
<div id="nt"><div id="card"></div></div></section>
<script>
// ✏️ Edit these slides to personalise: [emoji, title, text]
const S=[['💌','Dear Shivani','You are the kindest soul I know. Your smile turns ordinary days into festivals, and your love wraps everyone around you like a warm hug. Thank you for every bit of care and affection you give without asking for anything back. 🌸'],
['🌷','Your kindness','You notice the little things, and you make people feel special just by being you.'],
['💞','Your love','Soft, honest and endless. Being around you feels like coming home.'],
['💗','How much do I love you?','Tap the heart and see… 👇','tap'],
['🎁','My wish for you','May every dream bloom, may you laugh more than you worry, and may you be loved as much as you love. 🥰'],
['✨','Thanks for being born','Thanks for being born, Shivani 💖\nYou make this world prettier. 🌹']];
const $=s=>document.querySelector(s),R=Math.random;let ac,step=0,tries=0,fwT,hrT,dod=0,si=0,ty;
function tn(f,t,d,v=.25){const o=ac.createOscillator(),g=ac.createGain();o.type='triangle';o.frequency.value=f;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.02);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g).connect(ac.destination);o.start(t);o.stop(t+d+.05)}
function ns(d,v=.4,f=800,ty='highpass'){const b=ac.createBuffer(1,ac.sampleRate*d,ac.sampleRate),a=b.getChannelData(0);for(let i=0;i<a.length;i++)a[i]=(R()*2-1)*(1-i/a.length);const s=ac.createBufferSource(),fl=ac.createBiquadFilter(),g=ac.createGain();s.buffer=b;fl.type=ty;fl.frequency.value=f;g.gain.value=v;s.connect(fl).connect(g).connect(ac.destination);s.start()}
const boom=()=>{ns(.5,.5,300);setTimeout(()=>ns(.15,.3,3000),120);setTimeout(()=>ns(.1,.25,4000),200)};
function song(){const L=[[0,.75],[0,.25],[2,1],[0,1],[5,1],[4,2],[0,.75],[0,.25],[2,1],[0,1],[7,1],[5,2],[0,.75],[0,.25],[12,1],[9,1],[5,1],[4,1],[2,2],[10,.75],[10,.25],[9,1],[5,1],[7,1],[5,2]];let t=ac.currentTime+.3;for(const[n,b]of L){tn(261.63*2**(n/12),t,b*.45);t+=b*.45}}
const cv=$('#fw'),cx=cv.getContext('2d');let P=[];
function rs(){cv.width=innerWidth;cv.height=innerHeight}addEventListener('resize',rs);
function burst(x,y){boom();const h=320+R()*40;for(let i=0;i<60;i++){const a=R()*6.28,s=R()*5+1;P.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,l:1,c:`hsl(${h+R()*40},100%,${60+R()*20}%)`})}}
(function lp(){cx.clearRect(0,0,cv.width,cv.height);P=P.filter(p=>p.l>0);for(const p of P){p.x+=p.vx;p.y+=p.vy;p.vy+=.06;p.vx*=.98;p.l-=.014;cx.globalAlpha=p.l;cx.fillStyle=p.c;cx.beginPath();cx.arc(p.x,p.y,2.5,0,6.28);cx.fill()}requestAnimationFrame(lp)})();
function show(id){document.querySelectorAll('section').forEach(e=>e.classList.toggle('on',e.id==id))}
const msg=t=>$('#msg').textContent=t,tor=(x,y)=>{$('#dk').style.setProperty('--x',x+'px');$('#dk').style.setProperty('--y',y+'px')};
$('#go').onclick=()=>{ac=new(window.AudioContext||webkitAudioContext)();show('room');tor(innerWidth/2,innerHeight/2);msg('It’s so dark in here… move your torch 🔦 to find the matchbox');
const L=R()<.5,mb=$('#mb'),cd=$('#cd');mb.style.left=(L?12+R()*20:68+R()*20)+'%';cd.style.left=(L?68+R()*20:12+R()*20)+'%';mb.style.top=30+R()*40+'%';cd.style.top=40+R()*35+'%'};
const near=e=>{tor(e.clientX,e.clientY);const t=step==0?$('#mb'):step==1?$('#cd'):0;if(!t)return $('#hint').textContent='';const r=t.getBoundingClientRect(),d=Math.hypot(e.clientX-r.left-r.width/2,e.clientY-r.top-r.height/2),m=Math.min(innerWidth,innerHeight);$('#hint').textContent=d<m*.15?'🔥 Burning hot!':d<m*.35?'😊 Warm…':d<m*.6?'😐 Cool…':'🥶 Cold…'};
$('#room').addEventListener('pointermove',near);$('#room').addEventListener('pointerdown',near);
$('#mb').onclick=function(){if(step)return;step=1;this.style.display='none';ns(.1,.3,1500);msg('Got the matchbox! 🔥 Now find the candle 🕯️')};
$('#cd').onclick=function(){if(step<1)return msg('You need the matchbox first! 🔥');if(step>1)return;step=2;this.classList.add('lit');ns(.35,.4,2000);$('#dk').style.setProperty('--r','200px');msg('The candle is lit ✨ Make a wish, then blow it out! 🌬️');$('#blow').style.display='block';$('#mic').style.display='block'};
function blowIt(){if(step!=2||tries>=3)return;tries++;ns(.6,.5,700,'lowpass');const c=$('#cd');if(tries<3){c.classList.add('wob');setTimeout(()=>c.classList.remove('wob'),700);msg(tries==1?'Hmm… it’s still burning 🔥 Blow harder! 💨':'So close! Blow once more with all your love 😘')}else{c.classList.remove('lit');$('#blow').style.display='none';msg('Wish made! 💖');$('#mic').style.display='none';$('#dk').style.opacity=0;setTimeout(celebrate,1300)}}
$('#blow').onclick=blowIt;
$('#mic').onclick=async()=>{try{const st=await navigator.mediaDevices.getUserMedia({audio:true}),a=ac.createAnalyser(),b=new Uint8Array(a.fftSize);ac.createMediaStreamSource(st).connect(a);$('#mic').style.display='none';msg('Listening… blow into your mic! 🌬️');let w=0;const lp=setInterval(()=>{if(tries>=3)return clearInterval(lp);a.getByteTimeDomainData(b);const v=Math.max(...b.map(x=>Math.abs(x-128)));if(v>60&&!w){w=1;blowIt();setTimeout(()=>w=0,1200)}},80)}catch(e){msg('Mic not available, use the Blow button 💨')}};
function celebrate(){show('party');rs();song();burst(innerWidth/2,innerHeight/3);fwT=setInterval(()=>burst(R()*innerWidth,R()*innerHeight*.55),650);
hrT=setInterval(()=>{const s=document.createElement('span');s.className='hr';s.textContent=['💖','💕','🌸','💗','✨','🎀'][R()*6|0];s.style.left=R()*95+'%';s.style.fontSize=18+R()*22+'px';$('#party').appendChild(s);setTimeout(()=>s.remove(),6000)},500);
setTimeout(()=>{$('#bl').style.display='block';$('#pmsg').textContent='Pop the balloon 🎈'},7000)}
$('#bl').onclick=function(){const r=this.getBoundingClientRect();this.remove();ns(.12,.9,500);burst(r.left+r.width/2,r.top+r.height/2);const c=$('#ch');c.style.display='block';requestAnimationFrame(()=>requestAnimationFrame(()=>c.style.top='45%'));$('#pmsg').textContent='A letter is coming down… 💌';setTimeout(()=>{c.style.transition='left .3s,top .3s';$('#pmsg').textContent='Click on the letter 💌'},3100)};
const T=['Hehe, catch me if you can 😜','Too slow, cutie! 💨','Almost… 🤭','Naughty letter, come here! 💕','Okay okay, you win 😘'];
function dodge(e){if(dod>=5)return;if(e.type=='pointerdown')e.preventDefault();navigator.vibrate&&navigator.vibrate(40);const c=$('#ch');c.style.left=15+R()*70+'%';c.style.top=25+R()*45+'%';$('#pmsg').textContent=T[dod++]}
$('#ch').addEventListener('pointerenter',dodge);$('#ch').addEventListener('pointerdown',dodge);
let lt=0;$('#party').addEventListener('pointermove',e=>{if(Date.now()-lt<70)return;lt=Date.now();const s=document.createElement('span');s.className='sp';s.textContent=['💖','✨','💕'][R()*3|0];s.style.left=e.clientX+'px';s.style.top=e.clientY+'px';document.body.appendChild(s);setTimeout(()=>s.remove(),900)});
$('#ch').onclick=()=>{if(dod<5)return;$('#ch').style.display='none';clearInterval(fwT);$('#pmsg').textContent='';$('#nt').style.display='flex';ns(.2,.3,1200);sl()};
function sl(){const s=S[si],l=si==S.length-1,c=$('#card');c.innerHTML=`<div class="em">${s[0]}</div><h2>${s[1]}</h2><p id="tx"></p>${s[3]?'<button id="hrt">❤️</button>':''}<button class="btn" id="nx">${l?'Replay 🔁':'Next 💌'}</button><div class="dots">${S.map((_,i)=>'<i'+(i==si?' class="a"':'')+'></i>').join('')}</div>`;c.classList.toggle('fin',l);$('#nx').onclick=()=>l?location.reload():(si++,sl());if(l)burst(innerWidth/2,innerHeight/3);tn(988,ac.currentTime,.6,.15);tn(1318,ac.currentTime+.12,.8,.15);const ch=[...s[2]];let k=0;clearInterval(ty);ty=setInterval(()=>{$('#tx').textContent=ch.slice(0,++k).join('');if(k>=ch.length)clearInterval(ty)},28);const h=$('#hrt');if(h){let n=0;const hm=['Tap more… 💗','Keep going! 💕','More! 😍','Almost… 💞','Even more than that! ♾️💖'];h.onclick=()=>{n++;h.style.fontSize=80+n*18+'px';burst(innerWidth/2,innerHeight/2);navigator.vibrate&&navigator.vibrate(30);clearInterval(ty);$('#tx').textContent=hm[Math.min(n-1,4)]}}}
</script></body></html>
